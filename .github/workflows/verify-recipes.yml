name: Verify golden recipes

on:
  pull_request:
    paths:
      - "recipes/dsh-v0.1.5-rc.2/python-norris-ols/**"
      - ".github/workflows/verify-recipes.yml"
  push:
    branches: [main]
    paths:
      - "recipes/dsh-v0.1.5-rc.2/python-norris-ols/**"
      - ".github/workflows/verify-recipes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  norris-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Analyze
        working-directory: recipes/dsh-v0.1.5-rc.2/python-norris-ols
        run: python analyze.py
      - name: Verify certified values
        working-directory: recipes/dsh-v0.1.5-rc.2/python-norris-ols
        run: python verify.py
