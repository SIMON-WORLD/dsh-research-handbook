name: Runtime verify DSH Norris

# Re-queued after repository secret provisioning; remove this branch-only lane before final merge.
on:
  push:
    branches:
      - mission/verify-dsh-runtime-norris
    paths:
      - ".github/workflows/runtime-verify-dsh-norris.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DSH_TELEMETRY_MODE: DISABLED
      NO_COLOR: "1"
    defaults:
      run:
        working-directory: recipes/dsh-v0.1.5-rc.2/python-norris-ols
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record environment
        run: |
          set -euo pipefail
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "python=$(python --version 2>&1)"
          echo "kernel=$(uname -srm)"

      - name: Establish pinned package identity
        run: |
          set -euo pipefail
          resolved="$(npm view @deepseek-ai/dsh@0.1.5-rc.2 version)"
          test "$resolved" = "0.1.5-rc.2"
          echo "npm_resolved=@deepseek-ai/dsh@$resolved"
          npx -y @deepseek-ai/dsh@0.1.5-rc.2 --version

      - name: Credential gate
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error title=RUNTIME_VERIFICATION_BLOCKED::Repository secret DEEPSEEK_API_KEY is unavailable to this job."
            exit 78
          fi
          echo "DEEPSEEK_API_KEY=present (value not printed)"

      - name: Record pre-run oracle hashes
        run: |
          set -euo pipefail
          sha256sum data/norris.csv expected.json verify.py | tee "$RUNNER_TEMP/norris-before.sha256"

      - name: Run pinned DSH headless contract
        timeout-minutes: 5
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          set -uo pipefail
          set +e
          npx -y @deepseek-ai/dsh@0.1.5-rc.2 --profile headless \
            "Use only local files in this workspace. Run python analyze.py, then python verify.py. Do not edit data/norris.csv, expected.json, or verify.py. The task succeeds only if verify.py exits 0. Report result.json and the verifier status." \
            >"$RUNNER_TEMP/dsh.stdout" 2>"$RUNNER_TEMP/dsh.stderr"
          dsh_exit=$?
          set -e
          echo "dsh_exit=$dsh_exit"
          echo "--- dsh stdout (tail) ---"
          tail -n 80 "$RUNNER_TEMP/dsh.stdout" || true
          echo "--- dsh stderr (tail) ---"
          tail -n 80 "$RUNNER_TEMP/dsh.stderr" || true
          exit "$dsh_exit"

      - name: Check post-run oracle integrity
        if: always()
        run: |
          set -euo pipefail
          sha256sum data/norris.csv expected.json verify.py | tee "$RUNNER_TEMP/norris-after.sha256"
          if [ -f "$RUNNER_TEMP/norris-before.sha256" ]; then
            diff -u "$RUNNER_TEMP/norris-before.sha256" "$RUNNER_TEMP/norris-after.sha256"
          fi

      - name: Independently verify DSH result
        if: success()
        run: |
          set -euo pipefail
          test -f result.json
          python verify.py
